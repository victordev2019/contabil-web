
<mat-expansion-panel class="filtros-panel" [expanded]="true">
  <mat-expansion-panel-header>
    <mat-panel-title>Filtros</mat-panel-title>
  </mat-expansion-panel-header>

  <section class="filtros-content">
    <h2>Pesquisar Lote Outros Créditos/Débitos</h2>

    <form [formGroup]="filtrosForm" (ngSubmit)="onPesquisar()">
      <div class="filtros-grid">
        <div class="filtros-coluna">
          <mat-form-field appearance="outline">
            <mat-label>Instituição Resp.</mat-label>
            <input matInput type="text" formControlName="instituicaoResponsavel" />
          </mat-form-field>

          <mat-form-field appearance="outline">
            <mat-label>Instituição</mat-label>
            <input matInput type="text" formControlName="instituicao" />
          </mat-form-field>

          <mat-form-field appearance="outline">
            <mat-label>Situação Lote</mat-label>
            <mat-select formControlName="situacaoLote">
              <mat-option value="TODAS">Todas</mat-option>
              <mat-option value="ABERTO">Aberto</mat-option>
              <mat-option value="ENVIADO">Enviado</mat-option>
              <mat-option value="CONFIRMADO">Confirmado</mat-option>
            </mat-select>
          </mat-form-field>
        </div>

        <div class="filtros-coluna">
          <div class="campo-faixa campo-faixa-id">
            <label class="campo-faixa-label" for="idLoteDe">ID Lote</label>
            <div class="campo-faixa-inputs">
              <mat-form-field appearance="outline">
                <mat-label>De</mat-label>
                <input matInput type="number" formControlName="idLoteDe" />
              </mat-form-field>

              <mat-form-field appearance="outline">
                <mat-label>Até</mat-label>
                <input matInput type="number" formControlName="idLoteAte" />
              </mat-form-field>
            </div>
          </div>

          <div class="campo-faixa campo-faixa-valor">
            <label class="campo-faixa-label" for="valorLoteDe">Valor Lote</label>
            <div class="campo-faixa-inputs">
              <mat-form-field appearance="outline">
                <mat-label>De</mat-label>
                <input matInput type="number" formControlName="valorLoteDe" />
              </mat-form-field>

              <mat-form-field appearance="outline">
                <mat-label>Até</mat-label>
                <input matInput type="number" formControlName="valorLoteAte" />
              </mat-form-field>
            </div>
          </div>

          <div class="campo-faixa campo-faixa-data">
            <label class="campo-faixa-label" for="dataEntradaDe">Data Entrada</label>
            <div class="campo-faixa-inputs">
              <mat-form-field appearance="outline">
                <mat-label>De</mat-label>
                <input matInput [matDatepicker]="dataDe" formControlName="dataEntradaDe" />
                <mat-datepicker-toggle matIconSuffix [for]="dataDe"></mat-datepicker-toggle>
                <mat-datepicker #dataDe></mat-datepicker>
              </mat-form-field>

              <mat-form-field appearance="outline">
                <mat-label>Até</mat-label>
                <input matInput [matDatepicker]="dataAte" formControlName="dataEntradaAte" />
                <mat-datepicker-toggle matIconSuffix [for]="dataAte"></mat-datepicker-toggle>
                <mat-datepicker #dataAte></mat-datepicker>
              </mat-form-field>
            </div>
          </div>
        </div>
      </div>

      <div class="filtros-actions">
        <button mat-flat-button class="btn-primary" type="submit">
          Pesquisar
        </button>
      </div>
    </form>
  </section>
</mat-expansion-panel>
