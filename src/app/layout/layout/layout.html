<mat-sidenav-container class="layout-container">
  <mat-sidenav
    class="menu-lateral"
    [class.menu-recolhido]="!menuAberto()"
    [opened]="true"
    [mode]="'side'"
  >
    <app-menu-lateral
      [menuAberto]="menuAberto()"
      (alternarMenu)="alternarMenu()"
    />
  </mat-sidenav>

  <mat-sidenav-content class="layout-content">
    <app-cabecalho />

    <main class="layout-main">
      <router-outlet />
    </main>
  </mat-sidenav-content>
</mat-sidenav-container>
