<aside class="menu-container">
  <div class="menu-header">
    <button
      type="button"
      class="menu-button"
      [attr.aria-label]="menuAberto()
        ? 'Recolher menu de navegação'
        : 'Abrir menu de navegação'"
      [attr.aria-expanded]="menuAberto()"
      (click)="solicitarAlternancia()"
    >
      <span></span>
      <span></span>
      <span></span>
    </button>

    @if (menuAberto()) {
      <span class="menu-label">Contábil</span>
      <div class="menu-indicator"></div>
    }
  </div>
</aside>
